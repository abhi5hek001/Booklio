name: booklio
services:
  backend:
    image: abhi5hek001/app-backend:latest
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
    networks:
      - appnet
    restart: unless-stopped

  frontend:
    image: abhi5hek001/app-frontend:latest
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - appnet
    restart: unless-stopped

networks:
  appnet:
    driver: bridge
