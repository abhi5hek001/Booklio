name: Deploy Backend & Frontend to EC2

on:
  push:
    branches:
      - main 

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            # ----- Backend -----
            cd ~/Booklio/backend
            git pull origin main
            npm install
            pm2 restart booklio-backend || pm2 start server.js --name booklio-backend

            # ----- Frontend -----
            cd ~/Booklio/frontend
            git pull origin main
            npm install
            npx kill-port 5174 || true
            nohup npm run dev -- --port 5174 > ~/Booklio/frontend/frontend.log 2>&1 &
